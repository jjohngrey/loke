[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loke"
version = "0.1.0"
description = "Horizontal-layer scaffold for a neuroscience learning partner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "openai>=1.70,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["loke_intelligence", "loke_memory", "loke_contracts"]

[tool.setuptools.package-dir]
loke_intelligence = "layers/intelligence/loke_intelligence"
loke_memory = "layers/memory/loke_memory"
loke_contracts = "shared/contracts/loke_contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
