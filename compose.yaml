services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loke
      POSTGRES_USER: loke
      POSTGRES_PASSWORD: loke
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - loke_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loke"]
      interval: 5s
      retries: 10
volumes:
  loke_data:
